<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vocab Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: fröhlich, klar, kindgerecht – Klasse 6
   IDEA: ein Mode- und Bühnenstudio: Wörter lernen = Kleiderschrank füllen
   PICTURE: der eigene Avatar auf einer Bühne, zieht sich an, bewegt sich
   COLOUR and TYPE: Red-Line-Farben (Koralle, Rot, Blau, Beige), Baloo 2
   LAYOUT: Kopfleiste, große Kacheln, Arbeitsfläche mittig, iPad-tauglich */
:root{color-scheme:light;--coral:#E29C93;--red:#C4402F;--blue:#3E77AE;--lblue:#DFEEF4;--beige:#EEEBE4;--cream:#F7F3EA;--ink:#2a2422;--mut:#6d625c;--ok:#3f8f4a;--okl:#e3f2e1;--bad:#c4402f;--badl:#fbe3df;--gold:#e0a93a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--cream);color:var(--ink);font:17px/1.45 "Baloo 2",system-ui,"Segoe UI",sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input{font:inherit}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:8px max(3vw,12px);background:var(--coral);color:#fff}
.top h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.3px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tbtn{min-width:44px;height:44px;border-radius:22px;background:rgba(255,255,255,.22);color:#fff;font-weight:700;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tbtn:hover{background:rgba(255,255,255,.35)}
.stars{background:#fff;color:var(--red);border-radius:22px;padding:4px 14px;font-weight:800;white-space:nowrap}
main{max-width:1120px;margin:0 auto;padding:18px max(3vw,12px) 60px}
h2{font-size:30px;line-height:1.1;margin:6px 0 4px;color:var(--red)}
.sub{color:var(--mut);margin:0 0 16px}
.goal{background:var(--lblue);color:var(--blue);padding:10px 16px 14px;border-radius:12px 12px 12px 0;clip-path:polygon(0 0,100% 0,100% 82%,0 100%);margin-bottom:18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}
.tile{position:relative;background:#fff;border-radius:20px;padding:18px;text-align:left;box-shadow:0 3px 0 #e2dbcf,0 6px 18px rgba(80,50,30,.08);transition:transform .15s;display:flex;flex-direction:column;gap:6px;min-height:150px}
.tile:hover{transform:translateY(-3px)}
.tile .ico{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;font-size:34px}
.tile b{font-size:21px;line-height:1.1}
.tile small{color:var(--mut);font-size:15px;line-height:1.3}
.tile.locked{opacity:.75;background:#f1ede6}
.bar{height:10px;border-radius:5px;background:#eee6da;overflow:hidden;margin-top:auto}
.bar i{display:block;height:100%;background:var(--ok);border-radius:5px;transition:width .4s}
.home{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:760px){.home{grid-template-columns:1fr}}
.stage{position:relative;border-radius:22px;overflow:hidden;aspect-ratio:3/4;box-shadow:inset 0 0 0 3px rgba(0,0,0,.05)}
.stage svg.av{position:absolute;inset:6% 0 0;width:100%;height:94%}
.stage .place{position:absolute;left:10px;top:10px;background:rgba(255,255,255,.85);border-radius:12px;padding:0 10px;font-weight:700;font-size:15px;color:var(--blue)}
.bg-classroom{background:linear-gradient(#f3eee3 0 72%,#c8a679 72%)}
.bg-classroom::before{content:"";position:absolute;left:12%;right:12%;top:12%;height:26%;background:#3f6b4f;border:6px solid #a0784e;border-radius:6px}
.bg-stage{background:radial-gradient(ellipse at 50% 30%,#fff3c4 0,#f0c46a 30%,#7b2330 70%) ,#7b2330}
.bg-stage::before,.bg-stage::after{content:"";position:absolute;top:0;bottom:0;width:18%;background:repeating-linear-gradient(90deg,#a3243a 0 10px,#7d1a2b 10px 20px)}
.bg-stage::before{left:0}.bg-stage::after{right:0}
.bg-cinema{background:linear-gradient(#1f1c33 0 70%,#3a1a2a 70%)}
.bg-cinema::before{content:"";position:absolute;left:8%;right:8%;top:8%;height:30%;background:#f4f1ff;box-shadow:0 0 40px #b8b2ff;border-radius:4px}
.bg-filmset{background:linear-gradient(#d9e6ee 0 70%,#8a8a8a 70%)}
.bg-filmset::before{content:"🎬  💡  🎥";position:absolute;top:6%;width:100%;text-align:center;font-size:30px}
.bg-busstop{background:linear-gradient(#bfe2f6 0 70%,#7a7f86 70% 80%,#b9c46a 80%)}
.bg-busstop::before{content:"🚏";position:absolute;right:8%;top:30%;font-size:60px}
.bg-restaurant{background:linear-gradient(#f5d9b8 0 66%,#9b5a3c 66%)}
.bg-restaurant::before{content:"🍽️ 🍝 🥤";position:absolute;top:8%;width:100%;text-align:center;font-size:30px}
.bg-space{background:radial-gradient(circle at 20% 20%,#fff 0 1px,transparent 2px),radial-gradient(circle at 70% 30%,#fff 0 1px,transparent 2px),radial-gradient(circle at 40% 60%,#fff 0 1px,transparent 2px),radial-gradient(circle at 85% 70%,#fff 0 1.5px,transparent 2px),radial-gradient(circle at 10% 80%,#fff 0 1px,transparent 2px),#141633}
.bg-space::before{content:"🪐";position:absolute;right:8%;top:6%;font-size:44px}
.movebar{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chipbtn{min-height:40px;border-radius:20px;background:#fff;padding:2px 14px;font-weight:700;box-shadow:0 2px 0 #e2dbcf;font-size:16px}
.chipbtn.on{background:var(--blue);color:#fff}
.chipbtn:disabled{opacity:.45;cursor:default}
.card{background:#fff;border-radius:22px;padding:20px;box-shadow:0 3px 0 #e2dbcf,0 6px 18px rgba(80,50,30,.08)}
.btn{min-height:48px;border-radius:24px;padding:4px 22px;font-weight:800;background:var(--red);color:#fff;box-shadow:0 3px 0 #8f2a1e;font-size:18px}
.btn.alt{background:var(--blue);box-shadow:0 3px 0 #2a5580}
.btn.soft{background:var(--beige);color:var(--ink);box-shadow:0 3px 0 #d3ccc0}
.btn:active{transform:translateY(2px);box-shadow:none}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px;font-weight:700;color:var(--mut)}
.prog .bar{flex:1;margin:0}
/* Zuordnen */
.match{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin:14px 0}
.drop{background:#fff;border:3px dashed #d8cfc2;border-radius:18px;padding:10px;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;gap:6px;text-align:center;transition:.15s}
.drop.txt{min-height:110px;justify-content:center;font-weight:700;font-size:18px}
.drop .thumb{width:100%;height:96px}
.pic svg,.thumb svg{width:100%;height:100%;display:block}
.drop .slot{min-height:38px;width:100%;border-radius:12px;background:var(--beige);display:grid;place-items:center;font-weight:800;color:var(--mut)}
.drop.hover{border-color:var(--blue);background:var(--lblue)}
.drop.good{border:3px solid var(--ok);background:var(--okl)}
.drop.good .slot{background:var(--ok);color:#fff}
.drop.shake,.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:12px;background:var(--lblue);border-radius:18px;min-height:70px}
.chip{touch-action:none;user-select:none;-webkit-user-select:none;background:#fff;border-radius:14px;padding:8px 16px;font-weight:800;font-size:19px;color:var(--blue);box-shadow:0 3px 0 #b9cfdd;cursor:grab}
.chip.sel{outline:3px solid var(--red)}
.chip.dragging{opacity:.3}
.chip.ghost{position:fixed;z-index:99;pointer-events:none;transform:rotate(-3deg) scale(1.08);box-shadow:0 10px 24px rgba(0,0,0,.25)}
/* Beschriften */
.label-wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
@media(max-width:700px){.label-wrap{grid-template-columns:1fr}}
.fig{background:#fff;border-radius:22px;padding:8px}
.fig svg{width:100%;height:auto;max-height:68vh;display:block}
.lbls{display:grid;gap:8px}
.lbl{display:flex;align-items:center;gap:10px}
.num{flex:none;width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;font-weight:800;display:grid;place-items:center}
.lbl .drop{flex:1;min-height:48px;padding:4px 10px;flex-direction:row;justify-content:center;font-weight:800;font-size:18px;color:var(--mut)}
/* Eintippen */
.typer{max-width:640px;margin:0 auto;text-align:center}
.prompt{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:12px}
.prompt .pic{width:200px;height:170px}
.prompt .word{font-size:32px;font-weight:800;line-height:1.1}
.dir{display:inline-block;background:var(--beige);border-radius:12px;padding:0 12px;font-weight:700;color:var(--mut);font-size:15px}
.ans{color:var(--ink);-webkit-text-fill-color:var(--ink);caret-color:var(--red);width:100%;font-size:26px;padding:10px 16px;border-radius:16px;border:3px solid #d8cfc2;text-align:center;outline:none;background:#fff;font-weight:700}
.ans::placeholder{color:#a69b92;-webkit-text-fill-color:#a69b92}
.nametag{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;color:var(--red);font-weight:800;font-size:20px;padding:2px 16px;border-radius:14px;box-shadow:0 0 0 3px var(--coral);white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.ans:focus{border-color:var(--blue)}
.fb{min-height:64px;margin:12px 0;border-radius:16px;padding:10px;font-weight:700;font-size:19px}
.fb.ok{background:var(--okl);color:var(--ok)}
.fb.near{background:#fff4d6;color:#8a6200}
.fb.bad{background:var(--badl);color:var(--bad)}
.fb b{font-size:22px}
.seg{display:inline-flex;flex-wrap:wrap;background:var(--beige);border-radius:22px;padding:4px;gap:4px;margin:4px 0 14px}
.seg button{min-height:40px;border-radius:18px;padding:0 14px;font-weight:700;font-size:15px}
.seg button.on{background:#fff;color:var(--red);box-shadow:0 2px 0 #d3ccc0}
/* Karteikarten */
.flash{perspective:1200px;max-width:520px;margin:0 auto}
.fc{position:relative;height:380px;transition:transform .5s;transform-style:preserve-3d;cursor:pointer}
.fc.flip{transform:rotateY(180deg)}
.fc>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:24px;box-shadow:0 3px 0 #e2dbcf,0 8px 22px rgba(80,50,30,.1);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:18px;text-align:center}
.fc .back{transform:rotateY(180deg);background:var(--lblue)}
.fc .pic{width:240px;height:220px}
.fc .en{font-size:38px;font-weight:800;color:var(--blue);line-height:1.1}
.fc .de{font-size:28px;font-weight:800;line-height:1.15}
.hint{color:var(--mut);font-size:15px}
/* Quiz-Optionen */
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.opt{min-height:60px;border-radius:18px;background:#fff;font-weight:800;font-size:21px;box-shadow:0 3px 0 #e2dbcf;color:var(--blue)}
.opt.good{background:var(--ok);color:#fff}.opt.badc{background:var(--bad);color:#fff}
.picks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media(max-width:560px){.picks{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pick{background:#fff;border-radius:16px;padding:6px;box-shadow:0 3px 0 #e2dbcf;aspect-ratio:1}
.pick svg{width:100%;height:100%}
.pick.good{outline:4px solid var(--ok);background:var(--okl)}
.pick.badc{outline:4px solid var(--bad)}
/* Kleiderschrank */
.ward{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media(max-width:760px){.ward{grid-template-columns:1fr}}
.ward .stage{position:sticky;top:72px}
@media(max-width:760px){.ward .stage{position:relative;top:0;max-width:340px;margin:0 auto;width:100%}}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:10px}
.item{background:#fff;border-radius:16px;padding:6px 4px 4px;box-shadow:0 3px 0 #e2dbcf;display:flex;flex-direction:column;align-items:center;font-weight:800;font-size:14px;line-height:1.1;text-align:center;min-height:118px}
.item svg{width:100%;height:76px}
.item.worn{outline:4px solid var(--blue);background:var(--lblue)}
.item.lock{background:#ece7df;color:var(--mut);font-weight:600}
.item.lock svg{filter:grayscale(1) brightness(.75);opacity:.35}
.item.cur{box-shadow:0 0 0 3px var(--red)}
.cat{margin:18px 0 8px;font-size:20px;color:var(--red)}
.pal{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:40px;height:40px;border-radius:50%;box-shadow:inset 0 0 0 2px rgba(0,0,0,.15)}
.sw.lock{opacity:.25;background-image:none}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
/* Avatar */
.av g{transform-box:view-box}
.av .av-head{transform-origin:100px 94px}
.av .av-armL{transform-origin:66.5px 108px;transform:rotate(8deg)}
.av .av-armR{transform-origin:133.5px 108px;transform:rotate(-8deg)}
.av .av-legL{transform-origin:85px 204px}.av .av-legR{transform-origin:115px 204px}
.av .av-eyeR{transform-origin:111px 60px}
.av .av-torso{transform-origin:100px 204px}
.av .av-all{transform-origin:100px 330px}
.av .m-o{transform-origin:100px 79px}
.mv-nod .av-head{animation:nod 1.1s ease-in-out infinite}
@keyframes nod{0%,50%,100%{transform:translateY(0)}25%,75%{transform:translateY(6px) scaleY(.95)}}
.mv-shake .av-head{animation:shk 1s ease-in-out infinite}
@keyframes shk{0%,100%{transform:rotate(0)}25%{transform:rotate(-13deg)}75%{transform:rotate(13deg)}}
.mv-wave .av-armR{animation:wave .9s ease-in-out infinite}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-122deg)}}
.mv-clap .av-armL{animation:clapL .55s ease-in-out infinite}
.mv-clap .av-armR{animation:clapR .55s ease-in-out infinite}
@keyframes clapL{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(-20deg)}}
@keyframes clapR{0%,100%{transform:rotate(6deg)}50%{transform:rotate(20deg)}}
.mv-point .av-armR{animation:pnt 1.4s ease-in-out infinite}
@keyframes pnt{0%,100%{transform:rotate(-82deg)}50%{transform:rotate(-88deg)}}
.mv-shrug .av-armL{animation:shrL 1.6s ease-in-out infinite}
.mv-shrug .av-armR{animation:shrR 1.6s ease-in-out infinite}
.mv-shrug .av-head{animation:shrH 1.6s ease-in-out infinite}
@keyframes shrL{0%,100%{transform:rotate(8deg)}30%,70%{transform:translateY(-8px) rotate(32deg)}}
@keyframes shrR{0%,100%{transform:rotate(-8deg)}30%,70%{transform:translateY(-8px) rotate(-32deg)}}
@keyframes shrH{0%,100%{transform:none}30%,70%{transform:translateY(4px) rotate(-6deg)}}
.mv-wink .av-eyeR{animation:wink 1.6s infinite}
@keyframes wink{0%,35%,65%,100%{transform:scaleY(1)}42%,58%{transform:scaleY(.08)}}
.mv-smile .m-n{opacity:0}.mv-smile .m-b{opacity:1!important}
.mv-speak .m-n{opacity:0}.mv-speak .m-o{animation:talk .3s infinite alternate}
@keyframes talk{from{opacity:1;transform:scaleY(.25)}to{opacity:1;transform:scaleY(1)}}
.mv-breathe .av-torso{animation:br 2.6s ease-in-out infinite}
.mv-breathe .av-head{animation:brh 2.6s ease-in-out infinite}
@keyframes br{0%,100%{transform:scale(1)}50%{transform:scale(1.07,1.03)}}
@keyframes brh{0%,100%{transform:none}50%{transform:translateY(-3px)}}
.mv-standup .av-all{animation:su 2.4s ease-in-out infinite}
@keyframes su{0%,30%{transform:translateY(36px) scaleY(.85)}60%,100%{transform:none}}
.mv-walk .av-legL{animation:wl 1s ease-in-out infinite}
.mv-walk .av-legR{animation:wl 1s ease-in-out infinite reverse}
.mv-walk .av-armL{animation:wal 1s ease-in-out infinite}
.mv-walk .av-armR{animation:war 1s ease-in-out infinite}
@keyframes wl{0%,100%{transform:rotate(12deg)}50%{transform:rotate(-12deg)}}
@keyframes wal{0%,100%{transform:rotate(-10deg)}50%{transform:rotate(22deg)}}
@keyframes war{0%,100%{transform:rotate(10deg)}50%{transform:rotate(-22deg)}}
.hl{animation:pulse 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){.av *{animation-duration:3s!important}}
/* Rakete */
.arena{position:relative;height:min(72vh,640px);border-radius:22px;overflow:hidden;background:radial-gradient(circle at 15% 25%,#fff 0 1px,transparent 2px) 0 0/90px 90px,radial-gradient(circle at 60% 70%,#cfd8ff 0 1px,transparent 2px) 0 0/130px 130px,linear-gradient(#0d1030,#25204f);user-select:none;-webkit-user-select:none;touch-action:manipulation}
.met{position:absolute;top:0;left:0;transform:translate(-50%,-50%);min-width:120px;padding:14px 16px;border-radius:46% 54% 50% 50%/55% 45% 55% 45%;background:radial-gradient(circle at 35% 30%,#b9a28a,#7a6352 70%);color:#fff;font-weight:800;font-size:19px;text-align:center;box-shadow:inset -6px -6px 0 rgba(0,0,0,.18),0 0 0 3px rgba(255,255,255,.15);cursor:pointer;text-shadow:0 2px 0 rgba(0,0,0,.35);line-height:1.1}
.met.hit{animation:boom .4s forwards}
@keyframes boom{to{transform:translate(-50%,-50%) scale(1.8);opacity:0}}
.met.miss{background:radial-gradient(circle at 35% 30%,#ff8a7a,#b8323f 70%)}
.rocket{position:absolute;left:50%;bottom:16px;width:90px;margin-left:-45px;transition:transform .15s;transform-origin:50% 70%}
.rword{position:absolute;left:50%;bottom:8px;transform:translateX(-50%);background:#fff;color:var(--red);font-weight:800;font-size:22px;padding:2px 16px;border-radius:16px;white-space:nowrap;box-shadow:0 0 0 4px var(--coral)}
.laser{position:absolute;height:6px;border-radius:3px;background:linear-gradient(90deg,#fff,#ffe36b,#ff7a5c);transform-origin:0 50%;box-shadow:0 0 12px #ffe36b;animation:fade .35s forwards}
@keyframes fade{to{opacity:0}}
.hud{position:absolute;left:0;right:0;top:0;display:flex;justify-content:space-between;padding:10px 14px;color:#fff;font-weight:800;font-size:20px;pointer-events:none}
.over{position:absolute;inset:0;background:rgba(13,16,48,.86);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;padding:20px}
.over h3{font-size:34px;margin:0}
.ground{position:absolute;left:0;right:0;bottom:120px;border-top:2px dashed rgba(255,255,255,.25)}
/* Dialoge */
.modal{position:fixed;inset:0;background:rgba(40,25,20,.5);display:grid;place-items:center;z-index:50;padding:16px}
.modal .card{max-width:440px;width:100%}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:18px;padding:10px 20px;font-weight:800;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:tin .3s;max-width:92vw;text-align:center}
@keyframes tin{from{transform:translate(-50%,30px);opacity:0}}
.foot{text-align:center;margin-top:40px}
.foot button{color:var(--mut);font-size:15px;text-decoration:underline;min-height:44px}
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.prof{background:#fff;border-radius:18px;padding:8px;box-shadow:0 3px 0 #e2dbcf;font-weight:800;text-align:center}
.prof svg{width:100%;height:150px}
.opt-row{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 14px}
.hairbtn{width:64px;height:64px;border-radius:14px;background:#fff;box-shadow:0 2px 0 #e2dbcf;padding:2px}
.hairbtn svg{width:100%;height:100%}
.hairbtn.on{outline:3px solid var(--red)}
.list{columns:2 220px;gap:20px;font-size:16px}
.list div{break-inside:avoid;padding:2px 0;border-bottom:1px solid #eee6da}
.big{font-size:52px;line-height:1;font-weight:800;color:var(--red)}
.burst{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.burst span{position:absolute;top:-30px;font-size:28px;animation:fall 1.8s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
</style>
</head>
<body>
<div class="top"><button class="tbtn" id="backBtn" aria-label="Zurück">◀</button><h1 id="title">Vocab Studio</h1><span class="stars" id="stars">⭐ 0</span><button class="tbtn" id="sndBtn" aria-label="Ton an/aus">🔊</button></div>
<main id="app"></main>
<script>

/* ---- Antwortprüfung mit Kulanz ---- */
function alts(str){const out=[];str.split(/[;\/]/).forEach(p=>{p=p.trim().replace(/^hier:\s*/i,'');if(!p)return;if(p.includes('(')){out.push(p.replace(/\(.*?\)/g,'').trim());out.push(p.replace(/[()]/g,''))}else out.push(p)});return out}
function key(s){s=(s||'').toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[’`´]/g,"'").replace(/\.\.\.|…/g,'');let p;do{p=s;s=s.replace(/^(der|die|das|den|dem|ein|eine|einen|to|a|an|the)\s+/,'').trim()}while(s!==p);return s.replace(/[^a-z0-9]/g,'')}
const enKeys=w=>w.en.map(key);
const deKeys=w=>[...alts(w.de),...(w.deAlt||[])].map(key).concat(alts(w.de).filter(a=>/^sich /.test(a)).map(a=>key(a.slice(5))));
function lev(a,b){if(a===b)return 0;const m=a.length,n=b.length;let d=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){let prev=d[0];d[0]=i;for(let j=1;j<=n;j++){const t=d[j];d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1));prev=t}}return d[n]}
function check(input,w,toEn){
  const k=key(input);if(!k)return {r:'empty'};
  const keys=toEn?enKeys(w):deKeys(w);
  if(keys.includes(k))return {r:'ok'};
  // Kulanz: anderes Wort mit gleicher Bedeutung (z. B. calmly/quietly = ruhig)
  if(toEn){const dk=deKeys(w);const other=ALL.find(o=>o!==w&&enKeys(o).includes(k)&&deKeys(o).some(x=>dk.includes(x)));if(other)return {r:'ok',note:'Auch richtig! Im Buch steht hier: '+enMain(w)}}
  const lim=k.length<=3?0:k.length<=7?1:2;
  if(keys.some(x=>lev(x,k)<=lim))return {r:'near'};
  return {r:'bad'};
}
const conflict=(a,b)=>{if(a.sim&&a.sim===b.sim)return true;const da=deKeys(a),db=deKeys(b);if(da.some(x=>db.includes(x)))return true;const ea=enKeys(a),eb=enKeys(b);return ea.some(x=>eb.includes(x))};
function pickWords(pool,n){
  const sorted=shuffle(pool).sort((a,b)=>(mastered(a.id)-mastered(b.id))||(pts(a.id)-pts(b.id))*0);
  const out=[];for(const w of sorted){if(out.length>=n)break;if(out.every(o=>!conflict(o,w)))out.push(w)}return out;
}

function tone(f,d=.12,type='sine',v=.08,delay=0){if(!snd)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(AC.destination);const t=AC.currentTime+delay;o.start(t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.stop(t+d+.02)}catch(e){}}

}

/* ---------- Drag & Drop (Maus + Touch + Antippen) ---------- */
function dnd(onDrop){
  let sel=null;
  app.querySelectorAll('.chip').forEach(el=>{
    el.addEventListener('pointerdown',e=>{
      if(el.dataset.done)return;e.preventDefault();
      const r=el.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let moved=false,ghost=null,hov=null;
      const mv=ev=>{if(!moved&&Math.hypot(ev.clientX-sx,ev.clientY-sy)>6){moved=true;ghost=el.cloneNode(true);ghost.classList.add('ghost');ghost.style.width=r.width+'px';document.body.appendChild(ghost);el.classList.add('dragging')}
        if(!moved)return;ghost.style.left=(ev.clientX-ox)+'px';ghost.style.top=(ev.clientY-oy)+'px';
        const t=document.elementFromPoint(ev.clientX,ev.clientY);const d=t&&t.closest('.drop:not(.good)');if(hov&&hov!==d)hov.classList.remove('hover');if(d)d.classList.add('hover');hov=d;};
      const up=ev=>{window.removeEventListener('pointermove',mv);window.removeEventListener('pointerup',up);window.removeEventListener('pointercancel',up);
        if(hov)hov.classList.remove('hover');
        if(!moved){app.querySelectorAll('.chip.sel').forEach(c=>c.classList.remove('sel'));if(sel===el){sel=null}else{sel=el;el.classList.add('sel');say(el.textContent)}return}
        ghost.remove();el.classList.remove('dragging');
        const t=document.elementFromPoint(ev.clientX,ev.clientY);const d=t&&t.closest('.drop:not(.good)');if(d)onDrop(el,d);};
      window.addEventListener('pointermove',mv);window.addEventListener('pointerup',up);window.addEventListener('pointercancel',up);
    });
  });
  app.querySelectorAll('.drop').forEach(d=>d.addEventListener('click',()=>{if(sel&&!d.classList.contains('good')){const s=sel;sel=null;s.classList.remove('sel');onDrop(s,d)}}));
}

/* ---------- Zuordnen ---------- */
function match(a,back){
  const pool=poolOf(a,{noMoves:true});const PAGES=2,N=6;let page=0,score=0,total=0;const used=new Set();
  const run=()=>{
    const words=pickWords(pool.filter(w=>!used.has(w.id)),N);words.forEach(w=>used.add(w.id));
    if(!words.length)return finish();
    const missed=new Set();let left=words.length;
    screen('Zuordnen · '+AREA[a].name,back,`<div class="prog">Seite ${page+1} / ${PAGES}<span class="bar"><i style="width:${page/PAGES*100}%"></i></span></div>
     <div class="goal">${a==='c'?'Zieh das englische Wort auf das passende Bild.':'Zieh das englische Wort auf die deutsche Bedeutung.'} Du kannst auch erst ein Wort und dann ein Feld antippen.</div>
     <div class="chips">${shuffle(words).map(w=>`<span class="chip" data-id="${w.id}">${esc(enMain(w))}</span>`).join('')}</div>
     <div class="match">${shuffle(words).map(w=>a==='c'?`<div class="drop" data-id="${w.id}"><div class="thumb">${thumb(w)}</div><div class="slot">?</div></div>`:`<div class="drop txt" data-id="${w.id}"><div>${esc(w.de)}</div><div class="slot">?</div></div>`).join('')}</div>`);
    dnd((chip,drop)=>{const id=chip.dataset.id,w=BYID[id];
      if(drop.dataset.id===id){drop.classList.add('good');drop.querySelector('.slot').textContent=enMain(w);chip.remove();sGood();say(enMain(w));left--;total++;
        if(!missed.has(id)){score++;award(w,1)}
        if(!left){page++;setTimeout(()=>page<PAGES?run():finish(),700)}}
      else{missed.add(id);drop.classList.remove('shake');void drop.offsetWidth;drop.classList.add('shake');sBad()}});
  };
  const finish=()=>{if(a==='g'&&total>=6){if(!S.flags.gMatch){S.flags.gMatch=1;save();toast('✅ Zuordnen geschafft – ein Schritt zur Rakete!')}}sWin();burst();
    screen('Zuordnen · '+AREA[a].name,back,`<div class="card" style="text-align:center;max-width:520px;margin:0 auto"><div class="big">${score} / ${total}</div><p>beim ersten Versuch richtig</p><p class="row" style="justify-content:center"><button class="btn" id="again">Noch eine Runde</button><button class="btn soft" id="bk">Zurück</button></p></div>`);
    $('#again').onclick=()=>match(a,back);$('#bk').onclick=back;};
  run();
}

function typing(a,back){

const ROCKET_SVG=`<svg viewBox="0 0 90 140" class="rsvg"><path d="M45,4 C70,26 72,70 66,100 L24,100 C18,70 20,26 45,4 Z" fill="#f4f1ea" stroke="#9aa" stroke-width="2"/><path d="M45,4 C56,14 61,24 64,34 L26,34 C29,24 34,14 45,4Z" fill="#C4402F"/><circle cx="45" cy="56" r="11" fill="#3E77AE" stroke="#fff" stroke-width="4"/><path d="M24,78 L6,104 L24,100 Z M66,78 L84,104 L66,100Z" fill="#C4402F"/><path d="M32,100 L58,100 L52,112 L38,112Z" fill="#666"/><path d="M38,112 Q45,138 52,112 Z" fill="#ffb347"><animate attributeName="d" values="M38,112 Q45,138 52,112 Z;M38,112 Q45,128 52,112 Z;M38,112 Q45,138 52,112 Z" dur=".3s" repeatCount="indefinite"/></path></svg>`;
function rocket(back){
  const pool=rPool==='all'?ALL.slice():ALL.filter(w=>w.area===rPool);
  screen('Rocket Words',back,`<div class="arena" id="ar"><div class="hud"><span id="sc">⭐ 0</span><span id="lv">Level 1</span><span id="lf">❤️❤️❤️</span></div><div class="ground"></div><div class="rocket" id="rk">${ROCKET_SVG}</div><div class="rword" id="rw"></div></div>
   <p class="hint" style="text-align:center">Tipp: Lies das Wort auf der Rakete und tippe den passenden Meteor an.</p>`);
  const ar=$('#ar'),rk=$('#rk'),rw=$('#rw');
  let score=0,lives=3,speed=38,mets=[],cur=null,raf=0,last=0,alive=true,busy=false;const missedW=[];
  const W=()=>ar.clientWidth,H=()=>ar.clientHeight,groundY=()=>H()-120;
  const hud=()=>{$('#sc').textContent='⭐ '+score;$('#lv').textContent='Level '+(1+Math.floor(score/5));$('#lf').textContent='❤️'.repeat(lives)+'🖤'.repeat(3-lives)};
  const spawn=()=>{
    mets.forEach(m=>m.el.remove());mets=[];busy=false;
    const w=pool[Math.random()*pool.length|0];const toEn=rDir==='de-en'?true:rDir==='en-de'?false:Math.random()<.5;
    const ds=[];for(const o of shuffle(pool)){if(ds.length>=3)break;if(o!==w&&!conflict(o,w)&&ds.every(d=>!conflict(d,o)))ds.push(o)}
    cur={w,toEn};rw.textContent=toEn?alts(w.de)[0]:enMain(w);
    const opts=shuffle([w,...ds]);const n=opts.length,lane=W()/n;
    opts.forEach((o,i)=>{const el=document.createElement('button');el.className='met';el.textContent=toEn?enMain(o):alts(o.de)[0];
      const m={el,w:o,x:lane*(i+.5),y:-30-Math.random()*90};el.style.left=m.x+'px';el.style.top=m.y+'px';ar.appendChild(el);mets.push(m);
      el.addEventListener('pointerdown',ev=>{ev.preventDefault();shoot(m)});});
  };
  const shoot=m=>{if(!alive||busy)return;
    const rr=rk.getBoundingClientRect(),ab=ar.getBoundingClientRect();const x0=rr.left+rr.width/2-ab.left,y0=rr.top+20-ab.top;
    const dx=m.x-x0,dy=m.y-y0,ang=Math.atan2(dy,dx);rk.style.transform=`rotate(${ang*180/Math.PI+90}deg)`;
    const l=document.createElement('div');l.className='laser';l.style.left=x0+'px';l.style.top=y0+'px';l.style.width=Math.hypot(dx,dy)+'px';l.style.transform=`rotate(${ang}rad)`;ar.appendChild(l);setTimeout(()=>l.remove(),400);tone(900,.12,'sawtooth',.04);
    if(m.w===cur.w){busy=true;m.el.classList.add('hit');m.el.textContent='💥 '+m.el.textContent;score++;sGood();say(enMain(cur.w));award(cur.w,1);
      if(score%5===0){speed*=1.18;toast('🚀 Level '+(1+score/5)+'!')}hud();setTimeout(()=>{rk.style.transform='';spawn()},650)}
    else{m.el.classList.add('miss');sBad();lives--;missedW.push(cur.w);hud();setTimeout(()=>m.el.classList.remove('miss'),400);if(lives<=0)over()}
  };
  const loop=t=>{if(!alive)return;const dt=last?Math.min(.05,(t-last)/1000):0;last=t;
    for(const m of mets){m.y+=speed*dt;m.el.style.top=m.y+'px'}
    const c=mets.find(m=>m.w===cur.w);
    if(c&&!busy&&c.y>groundY()){busy=true;lives--;missedW.push(cur.w);sBad();c.el.classList.add('miss');rw.textContent=(cur.toEn?alts(cur.w.de)[0]:enMain(cur.w))+' = '+(cur.toEn?enMain(cur.w):alts(cur.w.de)[0]);hud();if(lives<=0){over();return}setTimeout(spawn,1300)}
    raf=requestAnimationFrame(loop)};
  const over=()=>{alive=false;cancelAnimationFrame(raf);const rec=score>S.best;if(rec)S.best=score;save();if(score>=15)sWin();
    const o=document.createElement('div');o.className='over';const uniq=[...new Set(missedW)];
    o.innerHTML=`<h3>${rec?'🏆 Neuer Rekord!':'Game over'}</h3><div class="big" style="color:#ffe36b">${score}</div><p>Punkte · Rekord: ${S.best}${score>=15&&rec?'<br>🪐 Ort „space“ freigeschaltet!':''}</p>${uniq.length?`<p style="max-width:460px">Übe noch: ${uniq.map(w=>`<b>${esc(enMain(w))}</b> = ${esc(alts(w.de)[0])}`).join(' · ')}</p>`:''}<p class="row" style="justify-content:center"><button class="btn" id="again">Nochmal</button><button class="btn soft" id="bk">Zurück</button></p>`;
    ar.appendChild(o);$('#again').onclick=()=>rocket(back);$('#bk').onclick=back;};
  stopFn=()=>{alive=false;cancelAnimationFrame(raf)};
  hud();spawn();raf=requestAnimationFrame(loop);
}

/* ---------- Lehrkraft ---------- */
function modal(html){const m=document.createElement('div');m.className='modal';m.innerHTML=`<div class="card">${html}</div>`;document.body.appendChild(m);m.addEventListener('click',e=>{if(e.target===m)m.remove()});return m}
function teacherCode(){
  const m=modal(`<h2>🔑 Lehrkraft</h2><p class="sub">Codewort eingeben</p><form id="cf"><input class="ans" id="code" autocomplete="off" autocapitalize="characters"></form><p class="fb" id="cfb" style="min-height:0"></p><p class="row"><button class="btn" id="cok">OK</button><button class="btn soft" id="cx">Abbrechen</button></p>`);
  const inp=m.querySelector('#code');setTimeout(()=>inp.focus(),50);
  const go=e=>{e&&e.preventDefault();const c=inp.value.trim().toUpperCase();
    if(c===CODE_ROCKET){if(!S){m.querySelector('#cfb').className='fb bad';m.querySelector('#cfb').textContent='Bitte zuerst ein Kind auswählen.';return}S.flags.rocket=1;save();m.remove();toast('🚀 Rocket Words freigeschaltet!');home()}
    else if(c===CODE_TEACH){m.remove();teacherPanel()}
    else{m.querySelector('#cfb').className='fb bad';m.querySelector('#cfb').textContent='Falsches Codewort.'}};
  m.querySelector('#cf').onsubmit=go;m.querySelector('#cok').onclick=go;m.querySelector('#cx').onclick=()=>m.remove();
}
function teacherPanel(){
  const names=Object.keys(DB.profiles);
  const m=modal(`<h2>Lehrkraft-Bereich</h2>${S?`<p>Aktuelles Kind: <b>${esc(S.name)}</b> · ${starCount()} ⭐</p>
   <p class="row"><button class="btn alt" id="t1">🚀 Rakete freischalten</button><button class="btn alt" id="t2">${S.flags.allUnlocked?'Demo-Modus aus':'✨ Alles freischalten (Demo)'}</button><button class="btn soft" id="t3">Fortschritt von ${esc(S.name)} löschen</button></p>`:'<p>Kein Kind ausgewählt.</p>'}
   <p class="hint">Profile auf diesem Gerät: ${names.length?names.map(esc).join(', '):'keine'}</p>
   <p class="row"><button class="btn soft" id="t4">Profil ${S?esc(S.name):''} entfernen</button><button class="btn" id="tx">Schließen</button></p><p class="fb" id="tfb" style="min-height:0"></p>`);
  const q=s=>m.querySelector(s);
  const confirm2=(btn,txt,fn)=>{if(btn.dataset.armed){fn()}else{btn.dataset.armed=1;btn.textContent=txt}};
  if(S){q('#t1').onclick=()=>{S.flags.rocket=1;save();m.remove();toast('🚀 Freigeschaltet');home()};
    q('#t2').onclick=()=>{S.flags.allUnlocked=!S.flags.allUnlocked;save();m.remove();home()};
    q('#t3').onclick=()=>confirm2(q('#t3'),'Wirklich löschen? Nochmal tippen',()=>{Object.assign(S,{pts:{},flags:{},outfit:{},colors:{},best:0,bg:'classroom'});save();m.remove();updStars();home()});
    q('#t4').onclick=()=>confirm2(q('#t4'),'Profil wirklich entfernen? Nochmal tippen',()=>{delete DB.profiles[S.name];S=null;DB.cur=null;save();m.remove();profiles()});}
  else q('#t4').style.display='none';
  q('#tx').onclick=()=>m.remove();
}

/* ---------- Start ---------- */
if(DB.cur&&DB.profiles[DB.cur]){S=DB.profiles[DB.cur];updStars();home()}else profiles();
}
</script>
